name: Android build
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK and release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: easy-garage-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Copy the test APK to a fixed name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk easy-garage-test.apk
      - name: Publish the test APK as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Easy Garage Android (test build)
          prerelease: true
          files: easy-garage-test.apk
          body: Test build with Google's AdMob test ads. For trying on a phone only, not for the Play Store.
      - name: Publish the unsigned release bundle (signed outside CI)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-bundle
          name: Easy Garage Android (unsigned bundle)
          prerelease: true
          files: android/app/build/outputs/bundle/release/app-release.aab
          body: Unsigned release bundle. It is signed with the upload key before going to Play Console.
