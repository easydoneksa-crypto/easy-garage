<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Easy Garage — Play</title><link rel="icon" href="../favicon.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><meta name="theme-color" content="#14171b"><meta name="google-adsense-account" content="ca-pub-6936703685284243"></head><body style="margin:0">
<style>
:root{--bg:#0f1214;--panel:#181c20;--panel2:#22272c;--line:#30363d;--ink:#e9edf1;--mute:#9aa4ad;--y:#ffc21a;--red:#e2453c;--ok:#3ecf7a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0f1214}}
:root[data-theme="light"]{--bg:#0f1214}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0}
.top{position:absolute;top:0;left:0;right:0;height:44px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 12px;background:#b3261e;color:#fff;font-weight:800;box-shadow:0 2px 8px #0006}
.top .logo{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#111;font-weight:900;font-size:13px;background:repeating-linear-gradient(-45deg,#ffc21a 0 6px,#ffd54a 6px 12px)}
.top .lv{font-weight:600;opacity:.9;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}.top .cost{background:#0003;border-radius:8px;padding:3px 10px;font-size:13px;white-space:nowrap}
#stage{position:absolute;top:44px;left:0;right:0;bottom:0;background:#8d9196}
#view{position:absolute!important;inset:0;width:100%;height:100%}#view canvas{display:block;width:100%!important;height:100%!important}
#ov{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
#leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;min-width:28px;height:28px;border-radius:14px;padding:0 7px;display:flex;align-items:center;justify-content:center;gap:4px;background:#fffffff0;color:#111;font:800 12px system-ui;border:2px solid #111;box-shadow:0 2px 8px #0008;cursor:pointer;white-space:nowrap}
.mk i{font-style:normal;font-weight:600;font-size:11px;max-width:0;overflow:hidden;transition:max-width .2s}
.mk:hover i,.mk.on i{max-width:220px}.mk.on{background:var(--y)}.mk.info{background:#2b6cb0;color:#fff}.mk.dis{border-style:dashed;background:#ffd7d3}
.tab{position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);z-index:60;width:46px;height:60px;border:0;border-start-end-radius:30px;border-end-end-radius:30px;background:#f4f4f4;color:#111;font-size:24px;box-shadow:0 3px 12px #0006}
.wr.on{background:var(--y)}
.cbar .cx{position:sticky;top:0;float:inline-end;border:0;background:#ddd;color:#111;width:34px;height:34px;border-radius:50%;font-size:16px}
.wr{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:90;width:62px;height:48px;border:0;border-radius:30px 30px 10px 10px;background:#f4f4f4;font-size:22px;box-shadow:0 3px 12px #0006}
.zoom{position:absolute;inset-inline-end:10px;top:56px;z-index:60;display:flex;flex-direction:column;gap:6px;background:#f4f4f4;padding:6px;border-radius:24px;box-shadow:0 3px 12px #0006}
.zoom button{width:40px;height:40px;border-radius:50%;border:1px solid #ccc;background:#fff;color:#111;font-size:17px;font-weight:800;display:grid;place-items:center}
.zoom button.on{background:var(--y)}
.drawer{position:absolute;top:44px;bottom:0;inset-inline-start:0;z-index:70;width:min(280px,82vw);background:#f3f3f3;color:#151515;overflow-y:auto;box-shadow:0 0 30px #0008;display:none;padding:8px 0 20px}
.drawer.on{display:block}
.drawer button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#151515;font-weight:600;padding:11px 16px;text-align:start}
.drawer button:hover{background:#e4e4e4}.drawer button.on{background:#ffe9a6}.drawer .ic{width:24px;text-align:center;font-size:18px}
.drawer .sec{font-size:12px;font-weight:800;color:#8a6d00;padding:12px 16px 4px}
.scrim{position:absolute;inset:0;z-index:65;display:none}.scrim.on{display:block}
.win{position:absolute;z-index:80;width:min(94vw,360px);max-height:calc(100% - 60px);display:flex;flex-direction:column;background:#1a1d21;border:1px solid #3a3f45;border-radius:14px;box-shadow:0 12px 34px #000b}
.win.wide{width:min(96vw,520px)}
.wh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 12px;cursor:move;touch-action:none;background:#262a2f;border-radius:14px 14px 0 0;font-weight:800;font-size:14px;user-select:none}
.wx{border:0;background:#3a3f45;color:#fff;width:30px;height:30px;border-radius:50%}
.wb{overflow:auto;padding:10px;overscroll-behavior:contain}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700}
.btn.y{background:var(--y);color:#111;border-color:var(--y)}.btn.r{background:#7a1f1a;border-color:#a33}.btn.sm{padding:5px 9px;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sub{color:var(--mute);font-size:13px}
/* instrument panel */
.ip{background:linear-gradient(#2c3035,#1b1e22);border-radius:12px;padding:10px}
.gg{display:flex;justify-content:space-around;align-items:center}
.lamps{display:flex;gap:8px;justify-content:center;margin:6px 0}.lamp{width:30px;height:22px;border-radius:5px;background:#222;display:grid;place-items:center;font-size:13px;filter:grayscale(1);opacity:.35}.lamp.on{filter:none;opacity:1;background:#3a1a10}
.keyrow{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:8px}
.kb{border:1px solid #444;background:#2a2f35;color:#fff;border-radius:8px;padding:7px 10px;font-weight:800}.kb.on{background:var(--y);color:#111}
.gas{width:100%;padding:12px;background:#2f3a2f;border-color:#4a6;user-select:none;touch-action:none}.gas.on{background:#3ecf7a;color:#111}
.start{background:#8b1c16;border-color:#b33;padding:10px 14px;user-select:none;touch-action:none}.start.on{background:#e2453c}
.state{text-align:center;margin-top:8px;font-size:13px;color:var(--y);min-height:20px}
/* multimeter */
.mm{background:linear-gradient(#f6c21a,#d99e00);border:3px solid #222;border-radius:20px;padding:12px;color:#222}
.mm .brand{font:800 11px Arial;letter-spacing:.1em}.mm .lcd{background:#b8c4a4;color:#16220e;font:700 34px/1.1 "Courier New",monospace;text-align:end;padding:10px 12px;border-radius:8px;margin:6px 0;box-shadow:inset 0 3px 8px #0005;min-height:58px;direction:ltr}
.mm .unit{font-size:16px}.dial{display:flex;justify-content:space-between;background:#2a2c2f;border-radius:40px;padding:6px;gap:4px}
.dial button{flex:1;border:0;border-radius:30px;background:#3d4045;color:#fff;font-weight:800;padding:8px 0;direction:ltr}.dial button.on{background:#fff;color:#111}
.jacks{display:flex;justify-content:center;gap:40px;margin-top:10px}.jack{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 11px Arial}
.ptip{width:30px;height:30px;border-radius:50%;border:3px solid #111;touch-action:none;cursor:grab;box-shadow:0 2px 6px #0007}.ptip.red{background:#d22}.ptip.blk{background:#111;border-color:#666}
.pinfo{font-size:12px;margin-top:8px;color:#222;line-height:1.5}
.drag{position:fixed;z-index:200;width:28px;height:28px;border-radius:50%;border:3px solid #fff;pointer-events:none;transform:translate(-50%,-50%)}
/* diag */
.scan{background:linear-gradient(#3a3f45,#24282c);border:2px solid #111;border-radius:14px;padding:10px}
.scr{background:#04130a;color:#4cf28f;font:600 13px/1.6 "Courier New",monospace;padding:10px;border-radius:6px;min-height:150px;direction:ltr;text-align:left;white-space:pre-wrap}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
/* fuel gauge */
.fg{background:linear-gradient(#e9ecef,#cfd4d9);color:#222;border-radius:14px;padding:10px;text-align:center}
/* work order / invoice */
.wo{background:#fbfbf7;color:#222;border-radius:10px;padding:12px}.wo h3{margin:4px 0 6px;font-size:15px}.wo .q{background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;margin-bottom:8px}
.wo select{width:100%;padding:8px;border-radius:8px;border:1px solid #bbb;font:inherit;background:#fff;color:#222}
.wo label{display:flex;gap:8px;align-items:center;margin:4px 0}.inv td{padding:4px 2px;border-bottom:1px solid #eee}.inv{width:100%;border-collapse:collapse;font-size:13px}.inv .tot td{font-weight:800;border-top:2px solid #222}
/* component bar */
.cbar{position:absolute;left:0;right:0;bottom:0;z-index:75;background:#f3f3f3;color:#151515;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #0007;max-height:60%;overflow:auto;padding:12px 12px calc(70px + env(safe-area-inset-bottom,0px));display:none}
.cbar.on{display:block}.cbar h3{margin:2px 0 8px}
.citem{background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px;margin-bottom:8px}.citem b{display:block}.citem .st{font-size:12px;color:#666;margin:2px 0 6px}
.citem .btn{background:#eee;color:#222;border-color:#ccc}.citem .btn.y{background:var(--y);border-color:var(--y)}
.pop{position:absolute;z-index:120;min-width:230px;max-width:min(92vw,320px);background:#fff;color:#111;border-radius:12px;box-shadow:0 10px 30px #0009;padding:10px;display:none}
.pop.on{display:block}.pop h4{margin:0 0 6px;font-size:14px}.pop .pin{border-top:1px solid #eee;padding:6px 0}.pop .pin b{font-size:13px}.pop .row{margin-top:4px}
.pop .btn{background:#eee;color:#111;border-color:#ccc;font-size:12px;padding:5px 8px}.pop .btn.rd{background:#d22;color:#fff;border-color:#d22}.pop .btn.bk{background:#111;color:#fff}
.toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:300;background:#111e;color:#fff;padding:9px 14px;border-radius:10px;font-weight:600;max-width:90vw;text-align:center;display:none}
.modal{position:absolute;inset:0;z-index:400;background:#000b;display:none;place-items:center;padding:16px}.modal.on{display:grid}
.mbox{width:min(440px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.stars{font-size:32px;color:var(--y);text-align:center;letter-spacing:4px}
.intro p{margin:6px 0}.intro ol{padding-inline-start:20px;margin:6px 0}

/* ---- tools as real objects ---- */
.dev{position:absolute;touch-action:none;cursor:grab;filter:drop-shadow(0 16px 14px rgba(0,0,0,.55)) drop-shadow(0 3px 3px rgba(0,0,0,.6));transition:filter .15s}
.dev.lift,.paper.lift{cursor:grabbing;filter:drop-shadow(0 30px 24px rgba(0,0,0,.55)) drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.dx{position:absolute;top:-10px;inset-inline-end:-10px;z-index:3;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:#222;color:#fff;font-size:13px;box-shadow:0 2px 6px #0008}
.mini{border:0;background:#222;color:#fff;border-radius:8px;padding:3px 8px;font-size:12px}
.d-ip{width:min(94vw,340px)}.d-mm,.d-scan,.d-fuel{width:auto}
.d-ip .db{background:linear-gradient(#26292d,#0d0f11);border-radius:22px;padding:10px 12px 8px;border:2px solid #000;box-shadow:inset 0 2px 0 #4a4f55,inset 0 -3px 8px #000}
.cluster{background:radial-gradient(120% 90% at 50% 10%,#1c2126,#06080a);border-radius:16px;padding:8px;box-shadow:inset 0 0 0 2px #000,inset 0 4px 10px #000}
.gg{display:flex;align-items:center;justify-content:center;gap:4px}.gsv{width:118px;height:118px}
.lamps{display:flex;flex-direction:column;gap:5px}.lamp{width:26px;height:20px;border-radius:5px;background:#111;color:#333;display:grid;place-items:center;font-size:12px;font-weight:900}.lamp.on{color:#ff9a1a;text-shadow:0 0 6px #ff9a1a;background:#2a1606}#lBat.on{color:#ff3b30;text-shadow:0 0 6px #ff3b30}
.lcdline{margin:4px auto 0;width:70%;text-align:center;background:#0a1a24;color:#7fd6ff;font:600 12px/1.6 system-ui;border-radius:6px;min-height:20px}
.controls{display:flex;align-items:center;justify-content:space-around;margin-top:8px;gap:8px}.ign{width:118px;height:118px;cursor:pointer}.kpos{cursor:pointer}
.pedal{width:74px;height:104px;border-radius:12px 12px 22px 22px;background:linear-gradient(#3b3f44,#1b1d20);border:2px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;color:#bbb;font-size:11px;font-weight:700;user-select:none;touch-action:none;cursor:pointer;transform-origin:50% 100%;transition:transform .12s;box-shadow:inset 0 2px 0 #5a5f66}
.pedal .pad{width:100%;flex:1;margin-bottom:6px;border-radius:8px;background:repeating-linear-gradient(0deg,#2b2e33 0 5px,#111 5px 8px)}.pedal.on{transform:perspective(200px) rotateX(28deg) scale(.96);color:#3ecf7a}
.hint{color:#8d969e;font-size:11px;text-align:center;margin-top:6px}
.holster{width:236px;padding:12px;border-radius:30px;background:linear-gradient(160deg,#ffd23a,#e0a100 60%,#b98300);box-shadow:inset 0 0 0 3px #a87400,inset 0 8px 12px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.25)}
.mmbody{background:linear-gradient(#3a3e44,#1d2024);border-radius:20px;padding:10px 10px 12px;box-shadow:inset 0 2px 0 #5d636a}
.mmbody .brand{color:#cfd3d7;font:800 9px Arial;letter-spacing:.12em;text-align:center}
.lcd{position:relative;margin:6px 0 4px;height:60px;border-radius:8px;background:linear-gradient(#b9c7a6,#9fb08b);box-shadow:inset 0 4px 10px rgba(0,0,0,.45);direction:ltr;overflow:hidden}
.lcd .ghost,.lcd #lcd{position:absolute;inset:0;padding:6px 10px;text-align:right;font:italic 700 36px/48px "Courier New",monospace}.lcd .ghost{color:rgba(0,0,0,.07)}.lcd #lcd{color:#14200c}.lcd .unit{font-size:15px;margin-left:4px;font-style:normal}
.dial{width:100%;height:auto;display:block}.mpos{cursor:pointer}
.jacks{display:flex;justify-content:center;gap:44px;margin-top:2px}.jack{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;color:#cfd3d7;font:700 10px Arial}
.sock{width:22px;height:22px;border-radius:50%;background:radial-gradient(#000 35%,#444 40%,#111 70%);border:2px solid #666}.sock.r{border-color:#c33}
.ptip{position:absolute;top:-4px;width:26px;height:26px;border-radius:50%;border:3px solid #000;touch-action:none;cursor:grab;box-shadow:0 3px 6px #000a}.ptip.red{background:radial-gradient(circle at 35% 30%,#ff6b6b,#b30d0d)}.ptip.blk{background:radial-gradient(circle at 35% 30%,#666,#050505);border-color:#888}
.pinfo{font-size:11px;color:#222;margin-top:6px;line-height:1.5;text-align:center}
.scanner{width:220px;padding:12px 12px 16px;border-radius:24px 24px 30px 30px;background:linear-gradient(160deg,#4a5058,#24282d 70%);border:2px solid #0d0f11;box-shadow:inset 0 2px 0 #6a7179,inset 0 -8px 14px rgba(0,0,0,.4);position:relative}
.sbrand{color:#ffc21a;font:800 10px Arial;letter-spacing:.14em;text-align:center;margin-bottom:6px}
.scanner .scr{background:linear-gradient(#071c10,#020a05);color:#58f29a;font:600 11px/1.55 "Courier New",monospace;padding:8px;border-radius:8px;min-height:140px;direction:ltr;text-align:left;white-space:pre-wrap;box-shadow:inset 0 3px 10px #000;border:3px solid #111}
.skeys{display:flex;gap:8px;margin-top:10px}.sk{flex:1;border:0;border-radius:12px;padding:6px 0;background:linear-gradient(#5b6168,#2c3035);color:#fff;font-weight:800;font-size:12px;line-height:1.1;box-shadow:0 3px 0 #0b0c0e}.sk.on{background:linear-gradient(#ffd23a,#e0a100);color:#111}.sk small{font-size:9px;font-weight:600}
.splug{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:34px;height:16px;border-radius:4px;background:#222;border:2px solid #000}
.fgauge{width:200px;display:flex;flex-direction:column;align-items:center}.gface{width:200px;height:200px}
.fneck{width:20px;height:16px;margin-top:-4px;background:linear-gradient(90deg,#9c7a1f,#f0cf6a,#9c7a1f)}
.fbody{width:74px;height:34px;border-radius:8px;background:linear-gradient(90deg,#8a6a17,#e9c75c,#8a6a17);display:flex;align-items:center;justify-content:space-between;padding:0 6px;border:1px solid #5a440c}
.bleed{width:22px;height:22px;border-radius:50%;border:2px solid #600;background:radial-gradient(circle at 35% 30%,#ff6b6b,#a00);color:transparent;padding:0}.flab{font:800 11px Arial;color:#2a1f05}

.ptip.hose{background:radial-gradient(circle at 35% 30%,#ffe08a,#9c7a1f);border-color:#5a440c}
.paper{position:absolute;touch-action:none;cursor:grab;width:min(calc(100vw - 100px),330px);background:linear-gradient(#8a6038,#6b4826);border-radius:12px;padding:26px 9px 9px;box-shadow:0 14px 26px rgba(0,0,0,.5);max-height:calc(100% - 70px);display:flex;flex-direction:column}
.paper.d-wiring{width:min(96vw,500px)}
.paper .clip{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:96px;height:30px;border-radius:8px 8px 14px 14px;background:linear-gradient(#f2f2f2,#8f949a 60%,#d6d9dc);border:1px solid #555;box-shadow:0 3px 4px #0006}
.paper .ptitle{position:absolute;top:30px;inset-inline-start:22px;z-index:2;font-weight:800;color:#333;font-size:13px}
.paper .db{background:#fbfaf3;border-radius:4px;padding:30px 12px 12px;overflow:auto;color:#222;box-shadow:inset 0 0 0 1px #e2dfcf;background-image:repeating-linear-gradient(#fbfaf3 0 27px,#e8ecf3 27px 28px)}
.paper .wo{background:transparent;padding:0}
.mk.cand{animation:mkp 1s ease-in-out infinite;border-color:#3ecf7a}.mk.snap{background:#3ecf7a!important;color:#111;transform:translate(-50%,-50%) scale(1.3);box-shadow:0 0 0 6px #3ecf7a66,0 2px 8px #0008}
@keyframes mkp{50%{box-shadow:0 0 0 7px #3ecf7a55,0 2px 8px #0008}}
.ptip.plug{background:linear-gradient(#3a3d41,#111);border-radius:5px;width:30px;height:22px;border-color:#000}.coupler-rest.dark{color:#ddd;text-shadow:none;margin-top:10px}.sdis{display:block;margin:8px auto 0}
.rz{position:absolute;bottom:-12px;inset-inline-end:-12px;z-index:4;width:30px;height:30px;border-radius:50%;background:#fff;color:#111;border:2px solid #222;display:grid;place-items:center;font-size:15px;font-weight:900;cursor:nwse-resize;touch-action:none;box-shadow:0 2px 6px #0008}
#wins>[data-w]{transform-origin:0 0}
#keyBlade{transition:transform .22s cubic-bezier(.3,1.5,.5,1);cursor:grab}.kdrag #keyBlade{transition:none}.ign{touch-action:none}

/* ===== Easy Garage brand colours (dark + yellow) ===== */
.top{background:linear-gradient(#1c2024,#121518);color:#fff;border-bottom:3px solid var(--y)}
.top .cost{background:var(--y);color:#111;font-weight:800}
#stage{background:#2a2e33}
.tab,.wr{background:#1f2327;color:var(--y);box-shadow:0 3px 12px #000a,inset 0 0 0 2px #ffc21a55}
.wr.on{background:var(--y);color:#111}
.zoom{background:#1f2327;box-shadow:0 3px 12px #000a}.zoom button{background:#2c3136;border-color:#3d434a;color:var(--y)}.zoom button.on{background:var(--y);color:#111}
.drawer{background:#181b1f;color:var(--ink);border-inline-end:3px solid var(--y)}.drawer button{color:var(--ink)}.drawer button:hover{background:#252a30}.drawer button.on{background:#3a2f0a;color:var(--y)}.drawer .sec{color:var(--y)}
.cbar{background:#181b1f;color:var(--ink);border-top:3px solid var(--y)}.cbar .sub{color:var(--mute)!important}.citem{background:#22272c;border-color:#333a41}.citem .st{color:var(--mute)}.citem .btn{background:#2f353b;color:var(--ink);border-color:#3d434a}.citem .btn.y{background:var(--y);color:#111}.cbar .cx{background:#2f353b;color:#fff}
.pop{background:#1f2327;color:var(--ink);border:1px solid #3d434a}.pop .pin{border-color:#333a41}.pop .btn{background:#2f353b;color:var(--ink);border-color:#3d434a}.pop .btn.rd{background:#d22;color:#fff}.pop .btn.bk{background:#000;color:#fff;border-color:#555}
.mk{background:var(--y);color:#111;border-color:#111}.mk.on{background:#fff}.mk.dis{background:#ffd7d3}

function setScale(id,s){const p=pos[id];if(!p)return;p.s=Math.max(.45,Math.min(2.2,s));const el=document.querySelector(`#wins>[data-w="${id}"]`);if(el)el.style.transform=`scale(${p.s})`;drawLeads()}
document.addEventListener("pointerdown",e=>{const r=e.target.closest(".rz");if(!r)return;const id=r.dataset.rz;if(pos[id])pos[id].user=1;rdrag={id,y0:e.clientY,x0:e.clientX,s0:(pos[id]&&pos[id].s)||1,h:r.parentElement.offsetHeight};e.preventDefault();e.stopPropagation();try{r.setPointerCapture(e.pointerId)}catch(_){}},true);
document.addEventListener("pointermove",e=>{if(!rdrag)return;const d=(e.clientY-rdrag.y0)+Math.abs(e.clientX-rdrag.x0)*Math.sign(e.clientY-rdrag.y0||1)*.3;setScale(rdrag.id,rdrag.s0*(1+d/rdrag.h))});
document.addEventListener("pointerup",()=>{rdrag=null});
document.addEventListener("pointerdown",e=>{const w=e.target.closest("#wins>[data-w]");if(!w||e.pointerType!=="touch")return;touches.set(e.pointerId,{id:w.dataset.w,x:e.clientX,y:e.clientY});
 const same=[...touches.values()].filter(t=>t.id===w.dataset.w);if(same.length===2){wdrag=null;const [a,b]=same;w._pinch={d0:Math.hypot(a.x-b.x,a.y-b.y),s0:(pos[w.dataset.w]&&pos[w.dataset.w].s)||1}}},true);
document.addEventListener("pointermove",e=>{const t=touches.get(e.pointerId);if(!t)return;t.x=e.clientX;t.y=e.clientY;const w=document.querySelector(`#wins>[data-w="${t.id}"]`);if(!w||!w._pinch)return;const same=[...touches.values()].filter(q=>q.id===t.id);if(same.length<2)return;const d=Math.hypot(same[0].x-same[1].x,same[0].y-same[1].y);setScale(t.id,w._pinch.s0*d/w._pinch.d0)});
const endT=e=>{const t=touches.get(e.pointerId);if(t){const w=document.querySelector(`#wins>[data-w="${t.id}"]`);if(w)w._pinch=null}touches.delete(e.pointerId)};document.addEventListener("pointerup",endT);document.addEventListener("pointercancel",endT);
document.addEventListener("wheel",e=>{const w=e.target.closest("#wins>[data-w]");if(!w)return;e.preventDefault();const id=w.dataset.w;setScale(id,((pos[id]&&pos[id].s)||1)*(e.deltaY<0?1.08:1/1.08))},{passive:false});

/* ignition key: drag to turn, tap a position, START springs back to ON */
let kdrag=null;
function keyAngle(){return KEYANG[Math.min(3,S.key)]}
function setBlade(a){const kb=$("keyBlade");if(kb)kb.style.transform=`rotate(${a}deg)`}
function setKey(n){if(n>=2&&S.key<2)S.prime=2;S.key=n;if(n<2){S.run=false;S.crank=false}paintLive()}
document.addEventListener("pointerdown",e=>{const sv=e.target.closest(".ign");if(!sv||e.target.closest(".kpos"))return;const r=sv.getBoundingClientRect();kdrag={cx:r.left+r.width/2,cy:r.top+r.height/2};sv.classList.add("kdrag");e.preventDefault();e.stopPropagation();try{sv.setPointerCapture(e.pointerId)}catch(_){}},true);
document.addEventListener("pointermove",e=>{if(!kdrag)return;let a=Math.atan2(e.clientY-kdrag.cy,e.clientX-kdrag.cx)*180/Math.PI+90;if(a>180)a-=360;a=Math.max(-75,Math.min(62,a));setBlade(a);kdrag.a=a;
 const n=a>=45?3:a>=-7?2:a>=-52?1:0;
 if(n===3){if(!S.start){if(S.key<2){S.prime=2}if(S.run){toast("Engine running")}else{S.key=3;S.crank=true;S.start=true;S.crankT=0;S.clickT=0}}}
 else{if(S.start){S.crank=false;S.start=false}if(n!==Math.min(2,S.key)||S.key===3)setKey(n)}});
document.addEventListener("pointerup",()=>{if(!kdrag)return;const sv=document.querySelector(".ign");if(sv)sv.classList.remove("kdrag");kdrag=null;if(S.start){S.crank=false;S.start=false;S.key=2}setBlade(keyAngle());paintLive()});

function finish(){const f=FAULTS[S.fault];const fixed=isFixedNow();const verified=S.verified&&S.run||S.verified;const right=S.diagSel===f.fix;
 const also=f.also||[];const ideal=Math.round(DIAG_H*RATE+(f.reseat?.2*RATE:COMPS[f.fix].price+COMPS[f.fix].lab*RATE)+also.reduce((a,k)=>a+COMPS[k].price+COMPS[k].lab*RATE,0));const tot=total();const okN=f.reseat?["Reseat "+f.rn]:[COMPS[f.fix].n,...also.map(k=>COMPS[k].n)];const extra=S.inv.filter(l=>!okN.includes(l.n));
 let stars=0;if(fixed)stars=1;if(fixed&&right)stars=2;if(fixed&&right&&!extra.length&&S.verified&&!S.hints)stars=3;PROG.stars[S.fault]=Math.max(PROG.stars[S.fault]||0,stars);PROG.done=(PROG.done||0)+1;saveProg();
 const mins=Math.max(1,Math.round((Date.now()-S.timeStart)/60000));
 $("mbox").innerHTML=`<h2 style="margin-top:0">${fixed?"Car returned to the customer ✅":"The customer brought the car back ❌"}</h2><div class="stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
 <p>${fixed?"The car runs.":"The car still won’t run! The fault isn’t fixed."} ${right?"And your diagnosis in the work order is correct.":"But the cause you wrote in the work order is wrong."}</p>
